name: Build release draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content Directory.Build.props
          if ($env:RELEASE_TAG -ne ('v' + $project.Project.PropertyGroup.Version)) { throw 'Tag and project version differ.' }
      - run: dotnet build NengliangReader.sln -c Release
      - run: dotnet run --project tests/Reader.Core.Tests -c Release --no-build
      - run: dotnet run --project tests/Reader.Chat.Tests -c Release --no-build
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/package-windows.ps1
          ./tests/Test-WindowsPackage.ps1 -Package ./artifacts/NengliangReader-win-x64.zip
      - if: runner.os == 'macOS'
        run: |
          bash build/package-macos.sh ${{ matrix.rid }}
          bash tests/test-macos-package.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.dmg
          if-no-files-found: error
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create release draft with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          version="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | tr -d '\r')"
          RELEASE_TAG="v$version"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving its assets and publication state."
            exit 0
          fi
          cd packages
          sha256sum *.zip *.dmg > SHA256SUMS.txt
          printf '%s\n' 'Windows/macOS 跨平台版本。macOS 包尚未完成 Developer ID 签名、公证及实机交互验收；请在发行说明中明确这些限制。' > notes.md
          gh release create "$RELEASE_TAG" *.zip *.dmg SHA256SUMS.txt --target "$TARGET_SHA" --draft --title "$RELEASE_TAG" --notes-file notes.md
